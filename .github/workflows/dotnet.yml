name: .NET CI/CD

on:
  push:
    branches: [ "part3-mvc" ]
  pull_request:
    branches: [ "part3-mvc" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Build API Project
      run: dotnet build Part2-Api/RaceDay.Api/RaceDay.Api.csproj
      
    - name: Build MVC Project
      run: dotnet build Part3-Mvc/RaceDay.Web/RaceDay.Web.csproj