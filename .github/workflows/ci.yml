name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore packages
        run: dotnet restore Part2-Api/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build
        run: dotnet build Part2-Api/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-restore

      - name: Run unit tests
        run: dotnet test Part2-Api/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --verbosity normal